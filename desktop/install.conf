# desktop/install.conf -- trusted host installation state.
#
# This file lives OUTSIDE every application package. It binds a stable
# application id to the installed package directory. The application id is the
# authority principal; the directory is only the install binding.
#
# A manifest DECLARES an id. It may never authenticate itself: the host runs an
# app only by installed id, and the manifest's declared id must match the
# installed id or startup fails.
#
# Format:  install <app-id> <package-dir>
#
# Moving/renaming a package does not create a new authority principal -- the id
# is unchanged; an unresolved binding simply fails closed.

install org.glon.fetch           apps/glon-fetch
install org.glon.authority-test  apps/glon-authority-test
