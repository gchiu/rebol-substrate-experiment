<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glon Desktop E2E harness</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; margin: 2rem auto; max-width: 42rem; }
  button { font: inherit; padding: .5rem .9rem; cursor: pointer; }
  pre { background: #f4f4f4; border: 1px solid #ddd; padding: 1rem; white-space: pre-wrap; }
  iframe.big { display: block; width: 100%; height: 360px; border: 1px solid #ddd; background: #fff; }
</style>
</head>
<body>
<!--
  Test-only harness: the same page shell and the same browser-host.js as
  index.html, plus automation. It clicks the real control-channel button and
  the real resource-channel selector, then reads the real iframe the browser
  fetched from /resource. It is not part of the application.
-->
<div id="app" data-glon-id="1"></div>
<pre id="verify">pending</pre>
<script src="browser-host.js"></script>
<script>
(function () {
  var verify = document.getElementById("verify");
  var clickedSmall = false, clickedLarge = false;
  setInterval(function () {
    var s = document.querySelector("[data-glon-native]");
    if (s && !clickedSmall) { clickedSmall = true; s.click(); }
    var l = document.querySelector("[data-glon-event='select-large']");
    if (l && !clickedLarge) { clickedLarge = true; l.click(); }
  }, 50);

  function read(f) {
    try {
      var d = f.contentDocument;
      var t = (d && d.body) ? d.body.textContent : "";
      verify.textContent = "iframe-bytes=" + t.length +
                           " marker=" + (t.indexOf("END-OF-BIG-FILE") >= 0);
    } catch (e) {
      verify.textContent = "iframe-read-error=" + e;
    }
  }
  var attached = null;
  setInterval(function () {
    var f = document.querySelector("iframe.big");
    if (!f || f === attached) return;
    attached = f;
    if (f.contentDocument && f.contentDocument.readyState === "complete") read(f);
    f.addEventListener("load", function () { read(f); });
  }, 50);
})();
</script>
</body>
</html>
