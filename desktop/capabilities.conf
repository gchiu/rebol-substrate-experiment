# desktop/capabilities.conf -- trusted capability catalogue (host/Glon metadata).
#
# This file lives OUTSIDE every application package and defines the CANONICAL
# meaning of each capability. It is trusted fact.
#
# An application may explain WHY it wants a capability (manifest "purpose:").
# It may never define WHAT the capability means.  Application purpose text
# cannot alter id/label/class/risk/allows.
#
# Format:
#   capability <id>
#     class  <brokered-service|scoped|general|privileged>
#     label  "human-readable description"
#     risk   <low|medium|high>
#     allows <semantic action>
#
# Classes (explanatory, not an enforcement shortcut -- the exact id controls
# authority):
#   brokered-service  narrow semantic operation performed by a trusted service
#   scoped            access limited to an application-owned/scoped area
#   general           broad access to a subsystem
#   privileged        powerful escape-hatch authority
#
# Risk is trusted explanatory metadata; it never overrides enforcement.

capability net/connect
  class general
  label "Connect to network services"
  risk medium
  allows outbound-network

capability file/app-write
  class scoped
  label "Write files in this application's private storage"
  risk low
  allows app-private-write

capability open/folder
  class brokered-service
  label "Open this application's folder"
  risk low
  allows user-visible-folder-open

capability process/spawn
  class privileged
  label "Run arbitrary child programs"
  risk high
  allows arbitrary-child-process

capability view/open
  class brokered-service
  label "Expose/open the Glon browser View"
  risk low
  allows open-glon-view

# Catalogue-only test capability: canonical semantics exist, but this host has
# NO implementation.  It must never become effective even if requested and
# granted -- a catalogue entry alone does not implement anything.
capability bluetooth/scan
  class general
  label "Scan for Bluetooth devices"
  risk medium
  allows device-discovery
