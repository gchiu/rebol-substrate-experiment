# desktop/grants.conf -- trusted host-side per-application grant state.
#
# This file lives OUTSIDE every application package. The application manifest
# REQUESTS authority; only this trusted state GRANTS it, and only to the exact
# installed application id. Editing a manifest can never manufacture authority.
#
# Format:
#   app <app-id>
#     grant <permission>
#
# Matching is exact: no wildcards, no prefix/substring matching, no global
# grants, no fallback. An id with no block (or none of a permission) gets none.

app org.glon.fetch
  grant net/connect
  grant file/app-write
  grant open/folder

app org.glon.authority-test
  # deliberately no grants: same requested permissions, no authority

# process/spawn is BROAD arbitrary child-process authority. It is not granted to
# Glon Fetch: the trusted fetch service implements downloading (internally with
# curl) without exposing arbitrary child-process execution to the application.
#
# view/open is the ability to expose/open the Glon browser View. Glon Fetch uses
# open/folder (opening the download directory), so semantics are not overloaded.
