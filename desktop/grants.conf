# desktop/grants.conf -- trusted host-side grant state.
#
# This file lives OUTSIDE the application package. The application manifest
# REQUESTS authority; only this trusted state GRANTS it. Editing the manifest
# (or adding arbitrary permissions to it) can never manufacture authority.
#
# Effective authority =
#     host implements  INTERSECT  manifest requests  INTERSECT  grants here
#
# Remove or comment a line to deny that permission.

grant net/connect
grant file/app-write
grant open/folder

# process/spawn is BROAD arbitrary child-process authority. It is intentionally
# not granted, and Glon Fetch does not request it: the trusted fetch service
# implements downloading (internally with curl) without exposing arbitrary
# child-process execution to the application.
# grant process/spawn
#
# view/open is the ability to expose/open the Glon browser View. Glon Fetch uses
# open/folder instead (opening the download directory), so the two semantics are
# not overloaded.
# grant view/open
