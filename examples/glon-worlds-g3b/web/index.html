<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glon Worlds</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.45 system-ui, sans-serif; background: #10161d; color: #e8eef5; }
  header { padding: 1rem; background: #172331; border-bottom: 1px solid #2b3d50; display: flex; align-items: baseline; gap: .75rem; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 1.35rem; }
  #group { padding: .15rem .55rem; border-radius: 999px; background: #27445d; color: #cfe6ff; }
  main { max-width: 55rem; margin: 0 auto; padding: 1rem; }
  #status { max-width: 55rem; margin: 1rem auto 0; padding: .6rem .9rem; border-radius: .5rem; background: #1b2a38; color: #b9cce0; }
  #status[data-kind="error"] { background: #4a2024; color: #ffd6da; }
  #status[data-kind="success"] { background: #1d3a2a; color: #c9f6d5; }
  #messages { display: flex; flex-direction: column; gap: .65rem; min-height: 5rem; }
  article { background: #182635; border: 1px solid #2b3d50; border-radius: .6rem; padding: .7rem .85rem; }
  article header { all: unset; display: flex; flex-wrap: wrap; gap: .5rem; align-items: baseline; color: #9bb4cc; font-size: .85rem; }
  article .author { color: #8fd3ff; font-weight: 600; }
  article .text { margin-top: .35rem; white-space: pre-wrap; overflow-wrap: anywhere; }
  .empty { color: #9bb4cc; font-style: italic; }
  .bar { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; margin: 1rem auto; max-width: 55rem; }
  button, textarea { font: inherit; }
  button { cursor: pointer; border: 1px solid #3a6488; background: #24415a; color: #e8eef5; border-radius: .45rem; padding: .55rem .8rem; }
  button:disabled { opacity: .55; cursor: default; }
  #older { background: #1c2c3b; }
  #user { margin-left: auto; color: #9bb4cc; font-size: .9rem; }
  #logout { background: #1c2c3b; padding: .35rem .65rem; }
  form { display: grid; gap: .55rem; grid-template-columns: 1fr auto; max-width: 55rem; margin: 0 auto 1rem; padding: 0 1rem; }
  textarea { min-height: 3.2rem; resize: vertical; padding: .6rem .7rem; border-radius: .5rem; border: 1px solid #3a6488; background: #0d151d; color: #e8eef5; }
  button[type="submit"] { align-self: end; }
  #auth { max-width: 55rem; margin: 1rem auto; padding: 0 1rem; display: grid; gap: 1rem; grid-template-columns: 1fr 1fr; }
  .auth-form { display: grid; grid-template-columns: 1fr; gap: .55rem; margin: 0; padding: 1rem; background: #182635; border: 1px solid #2b3d50; border-radius: .6rem; }
  .auth-form h2 { margin: 0 0 .25rem; font-size: 1.05rem; }
  .auth-form label { display: grid; gap: .25rem; font-size: .9rem; color: #b9cce0; }
  .auth-form input { font: inherit; padding: .5rem .6rem; border-radius: .45rem; border: 1px solid #3a6488; background: #0d151d; color: #e8eef5; }
  .auth-form button { width: 100%; }
  #auth[hidden], #chat[hidden], #logout[hidden] { display: none; }
  @media (max-width: 46rem) { #auth { grid-template-columns: 1fr; } }
  @media (max-width: 34rem) { form { grid-template-columns: 1fr; } button[type="submit"] { width: 100%; } }
</style>
</head>
<body>
<header>
  <h1>Glon Worlds</h1>
  <span id="group">general</span>
  <span id="user"></span>
  <button id="logout" type="button" hidden>Log out</button>
</header>
<div id="status" aria-live="polite">Checking session…</div>
<section id="auth" hidden>
  <form id="login" class="auth-form">
    <h2>Sign in</h2>
    <label>Username<input id="login-username" autocomplete="username" maxlength="64" required></label>
    <label>Password<input id="login-password" type="password" autocomplete="current-password" maxlength="1024" required></label>
    <button type="submit" id="login-button">Log in</button>
  </form>
  <form id="register" class="auth-form">
    <h2>Register</h2>
    <label>Username<input id="reg-username" autocomplete="username" maxlength="64" required></label>
    <label>Display name<input id="reg-display" maxlength="64"></label>
    <label>Invitation code<input id="reg-invite" autocomplete="off" maxlength="128" required></label>
    <label>Password<input id="reg-password" type="password" autocomplete="new-password" maxlength="1024" required></label>
    <button type="submit" id="register-button">Create account</button>
  </form>
</section>
<div id="chat" hidden>
<main>
  <div class="bar">
    <button id="older" type="button" disabled>Load older</button>
    <button id="refresh" type="button">Refresh</button>
  </div>
  <div id="messages"></div>
</main>
<form id="send">
  <textarea id="text" maxlength="1024" placeholder="Write a message…" aria-label="Message"></textarea>
  <button type="submit" id="send-button">Send</button>
</form>
</div>
<script>
"use strict";
const GROUP = "general";
const PAGE = 9;                 /* W2 server maximum page size */
const POLL_MS = 2000;
const MAX_BACKOFF_MS = 30000;
const byId = new Map();
let windowStart = 0;
let busy = false;
let pollTimer = null;
let pollInFlight = false;
let pollFailures = 0;
let pollHadError = false;
let currentUser = null;
let csrfToken = null;
let authBusy = false;

const statusEl = document.getElementById("status");
const messagesEl = document.getElementById("messages");
const olderEl = document.getElementById("older");
const refreshEl = document.getElementById("refresh");
const formEl = document.getElementById("send");
const textEl = document.getElementById("text");
const sendEl = document.getElementById("send-button");
const authEl = document.getElementById("auth");
const chatEl = document.getElementById("chat");
const userEl = document.getElementById("user");
const logoutEl = document.getElementById("logout");
const loginEl = document.getElementById("login");
const loginUserEl = document.getElementById("login-username");
const loginPassEl = document.getElementById("login-password");
const loginBtn = document.getElementById("login-button");
const registerEl = document.getElementById("register");
const regUserEl = document.getElementById("reg-username");
const regDisplayEl = document.getElementById("reg-display");
const regInviteEl = document.getElementById("reg-invite");
const regPassEl = document.getElementById("reg-password");
const regBtn = document.getElementById("register-button");

function status(message, kind) {
  statusEl.textContent = message;
  if (kind) statusEl.dataset.kind = kind; else delete statusEl.dataset.kind;
}

function sorted() {
  return Array.from(byId.values()).sort((a, b) => a.id - b.id);
}

function addMessages(messages) {
  let added = 0;
  for (const m of messages) {
    if (m && Number.isInteger(m.id) && !byId.has(m.id)) {
      byId.set(m.id, m);
      added++;
    }
  }
  return added;
}

function render() {
  const all = sorted();
  const end = Math.min(all.length, windowStart + PAGE);
  messagesEl.replaceChildren();
  if (all.length === 0) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "No messages in this group yet.";
    messagesEl.append(p);
  } else {
    for (const m of all.slice(windowStart, end)) {
      const card = document.createElement("article");
      const head = document.createElement("header");
      const author = document.createElement("span");
      author.className = "author";
      author.textContent = String(m.author ?? "unknown");
      const id = document.createElement("span");
      id.textContent = "#" + String(m.id);
      const time = document.createElement("time");
      const when = new Date(String(m.created_at ?? ""));
      time.textContent = Number.isNaN(when.getTime())
        ? String(m.created_at ?? "") : when.toLocaleString();
      head.append(author, id, time);
      const body = document.createElement("div");
      body.className = "text";
      /* Message text is untrusted: assign text content only. */
      body.textContent = String(m.text ?? "");
      card.append(head, body);
      messagesEl.append(card);
    }
  }
  olderEl.disabled = busy || windowStart <= 0;
  if (all.length === 0) status("No messages yet.", null);
  else status(`${all.length} message${all.length === 1 ? "" : "s"} loaded; showing ${windowStart + 1}–${end}.`, null);
}

function httpError(message, statusCode) {
  const err = new Error(message);
  err.status = statusCode;
  return err;
}

async function parseError(res) {
  let detail = "";
  try {
    const data = await res.json();
    detail = data && data.error ? String(data.error) : "";
  } catch (_) { /* non-JSON error */ }
  if (res.status === 503) {
    throw httpError(detail || "History is busy; try again shortly.", 503);
  }
  if (res.status === 401) {
    throw httpError(detail || "Authentication required.", 401);
  }
  if (res.status === 400) {
    throw httpError(detail || "The request was rejected.", 400);
  }
  throw httpError(detail || `Request failed (HTTP ${res.status}).`, res.status);
}

function newestId() {
  const all = sorted();
  return all.length ? all[all.length - 1].id : 0;
}

function atNewestView() {
  return windowStart + PAGE >= byId.size;
}

function resetPolling() {
  pollFailures = 0;
  pollHadError = false;
  schedulePoll(POLL_MS);
}

function schedulePoll(delay) {
  if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
  if (document.visibilityState === "hidden" || !currentUser) return;
  pollTimer = setTimeout(poll, delay);
}

function pollErrorText(e) {
  return e && e.message ? String(e.message) : String(e);
}

async function poll() {
  pollTimer = null;
  if (document.visibilityState === "hidden" || !currentUser) return;
  if (pollInFlight || busy) { schedulePoll(POLL_MS); return; }
  pollInFlight = true;
  const stayAtNewest = atNewestView();
  const recovering = pollHadError;
  const before = byId.size;
  try {
    await fetchAll(newestId());
    const added = byId.size - before;
    pollFailures = 0;
    if (added) {
      if (stayAtNewest) windowStart = Math.max(0, sorted().length - PAGE);
      render();
      status(`${added} new message${added === 1 ? "" : "s"} loaded.`, "success");
    } else if (recovering) {
      status(`${byId.size} message${byId.size === 1 ? "" : "s"} loaded.`, null);
    }
    pollHadError = false;
  } catch (e) {
    if (e && e.status === 401) {
      stopChat("Session expired. Sign in again.", "error");
      return;
    }
    pollFailures++;
    pollHadError = true;
    if (byId.size > before) {
      if (stayAtNewest) windowStart = Math.max(0, sorted().length - PAGE);
      render();
    }
    status(`Live updates paused: ${pollErrorText(e)} Retrying…`, "error");
  } finally {
    pollInFlight = false;
    schedulePoll(pollHadError
      ? Math.min(POLL_MS * Math.pow(2, Math.max(0, pollFailures - 1)), MAX_BACKOFF_MS)
      : POLL_MS);
  }
}

async function fetchPage(after, limit) {
  const url = `/api/messages?group=${encodeURIComponent(GROUP)}` +
              `&after=${encodeURIComponent(String(after))}` +
              `&limit=${encodeURIComponent(String(limit))}`;
  const res = await fetch(url, { cache: "no-store", headers: { Accept: "application/json" } });
  if (!res.ok) throw await parseError(res);
  const data = await res.json();
  if (!Array.isArray(data.messages)) throw new Error("Malformed message page.");
  return data;
}

async function fetchAll(after) {
  let cursor = after;
  let added = 0;
  for (let guard = 0; guard < 1000; guard++) {
    const data = await fetchPage(cursor, PAGE);
    added += addMessages(data.messages);
    if (!data.has_more) return added;
    const next = Number(data.next_after);
    if (!Number.isInteger(next) || next <= cursor) throw new Error("Pagination did not advance.");
    cursor = next;
  }
  throw new Error("Too many history pages.");
}

function setBusy(value) {
  busy = value;
  sendEl.disabled = value;
  refreshEl.disabled = value;
  olderEl.disabled = value || windowStart <= 0;
}

function setUser(user) {
  currentUser = user || null;
  if (!currentUser) csrfToken = null;
  userEl.textContent = currentUser
    ? String(currentUser.display_name || currentUser.username || "") : "";
  logoutEl.hidden = !currentUser;
  authEl.hidden = !!currentUser;
  chatEl.hidden = !currentUser;
  if (!currentUser) {
    messagesEl.replaceChildren();
    olderEl.disabled = true;
  }
}

function stopChat(message, kind) {
  if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
  pollInFlight = false;
  byId.clear();
  windowStart = 0;
  setUser(null);
  if (message) status(message, kind || null);
}

async function startChat(user, csrf) {
  setUser(user);
  csrfToken = csrf || null;
  byId.clear();
  windowStart = 0;
  pollFailures = 0;
  pollHadError = false;
  await initial();
  schedulePoll(POLL_MS);
}

async function checkSession() {
  try {
    const res = await fetch("/api/auth/session", {
      cache: "no-store", headers: { Accept: "application/json" }
    });
    if (!res.ok) throw await parseError(res);
    const data = await res.json();
    if (data && data.user) await startChat(data.user, data.csrf);
    else {
      setUser(null);
      status("Sign in or register to continue.", null);
    }
  } catch (e) {
    setUser(null);
    status("Sign in or register to continue.", "error");
  }
}

function setAuthBusy(value) {
  authBusy = value;
  loginBtn.disabled = value;
  regBtn.disabled = value;
}

async function doLogin(username, password) {
  if (authBusy) return;
  setAuthBusy(true);
  status("Signing in…");
  try {
    const res = await fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json", Accept: "application/json" },
      body: JSON.stringify({ username, password })
    });
    if (!res.ok) throw await parseError(res);
    const data = await res.json();
    loginEl.reset();
    await startChat(data.user, data.csrf);
    status("Signed in.", "success");
  } catch (e) {
    status(String(e.message || e), "error");
  } finally {
    setAuthBusy(false);
  }
}

async function doRegister(username, displayName, password) {
  if (authBusy) return;
  setAuthBusy(true);
  status("Creating account…");
  try {
    const res = await fetch("/api/auth/register", {
      method: "POST",
      headers: { "Content-Type": "application/json", Accept: "application/json" },
      body: JSON.stringify({
        username, password,
        invite: regInviteEl.value,
        display_name: displayName.length ? displayName : username
      })
    });
    if (!res.ok) throw await parseError(res);
    await res.json();
    registerEl.reset();
    loginUserEl.value = username;
    loginPassEl.focus();
    status("Account created. Sign in to continue.", "success");
  } catch (e) {
    status(String(e.message || e), "error");
  } finally {
    setAuthBusy(false);
  }
}

async function doLogout() {
  if (authBusy) return;
  setAuthBusy(true);
  logoutEl.disabled = true;
  try {
    await fetch("/api/auth/logout", {
      method: "POST",
      headers: {
        Accept: "application/json",
        "X-CSRF-Token": String(csrfToken || "")
      }
    });
  } catch (_) { /* clear locally regardless */ }
  logoutEl.disabled = false;
  setAuthBusy(false);
  stopChat("Signed out.", null);
}

async function initial() {
  if (busy) return;
  setBusy(true);
  status("Loading messages…");
  try {
    byId.clear();
    await fetchAll(0);
    windowStart = Math.max(0, sorted().length - PAGE);
    render();
  } catch (e) {
    if (e && e.status === 401) { stopChat("Session expired. Sign in again.", "error"); return; }
    status(String(e.message || e), "error");
  } finally {
    setBusy(false);
  }
}

async function refresh() {
  if (busy) return;
  setBusy(true);
  status("Refreshing…");
  try {
    const added = await fetchAll(newestId());
    windowStart = Math.max(0, sorted().length - PAGE);
    render();
    if (added) status(`Loaded ${added} new message${added === 1 ? "" : "s"}.`, "success");
    else status("Already up to date.", null);
    resetPolling();
  } catch (e) {
    if (e && e.status === 401) { stopChat("Session expired. Sign in again.", "error"); return; }
    status(String(e.message || e), "error");
  } finally {
    setBusy(false);
  }
}

async function older() {
  if (busy || windowStart <= 0) return;
  windowStart = Math.max(0, windowStart - PAGE);
  render();
}

async function send() {
  const text = textEl.value;
  if (text.length === 0) { status("Enter a message first.", "error"); return; }
  if (text.length > 1024) { status("Message is longer than 1,024 bytes.", "error"); return; }
  setBusy(true);
  status("Sending…");
  try {
    const res = await fetch(`/api/messages`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json", Accept: "application/json",
        "X-CSRF-Token": String(csrfToken || "")
      },
      body: JSON.stringify({ text, group: GROUP })
    });
    if (!res.ok) throw await parseError(res);
    const m = await res.json();
    addMessages([m]);
    windowStart = Math.max(0, sorted().length - PAGE);
    textEl.value = "";
    render();
    status("Message sent.", "success");
    resetPolling();
  } catch (e) {
    if (e && e.status === 401) { stopChat("Session expired. Sign in again.", "error"); return; }
    status(String(e.message || e), "error");
  } finally {
    setBusy(false);
  }
}

olderEl.addEventListener("click", older);
refreshEl.addEventListener("click", refresh);
formEl.addEventListener("submit", (ev) => { ev.preventDefault(); send(); });
textEl.addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); send(); }
});
loginEl.addEventListener("submit", (ev) => {
  ev.preventDefault();
  doLogin(loginUserEl.value, loginPassEl.value);
});
registerEl.addEventListener("submit", (ev) => {
  ev.preventDefault();
  doRegister(regUserEl.value, regDisplayEl.value, regPassEl.value);
});
logoutEl.addEventListener("click", doLogout);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") {
    if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
  } else if (currentUser) {
    pollFailures = 0;
    poll();
  }
});
checkSession();
window.addEventListener("beforeunload", () => {
  if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
});
</script>
</body>
</html>
