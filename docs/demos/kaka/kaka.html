<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attack of the Mutant Kaka</title>
<style>
  body { font: 15px/1.4 system-ui, sans-serif; margin: 1rem auto; max-width: 680px; background: #0b1020; color: #e8e8e8; }
  h1 { margin: .2rem 0; }
  .tag { color: #7fd18a; font-weight: 700; margin: .1rem 0 .6rem; }
  .hud { font-size: 1.05rem; }
  .mutant { color: #ff3df0; font-weight: 800; letter-spacing: .04em; animation: pulse .5s steps(2) infinite; }
  @keyframes pulse { 50% { opacity: .55; } }
  .muted { color: #9aa1ad; }
  #glon-canvas { display: block; width: 640px; height: 480px; border: 1px solid #334; background: #0b1020; }
  #glon-canvas:focus { outline: 2px solid #556; outline-offset: 2px; }
  button { font: inherit; padding: .4rem .8rem; cursor: pointer; }
  .keys { color: #ffe066; font-size: 1rem; font-weight: 600; margin: .4rem 0 .7rem; }
  .keys strong { color: #fff; }
  a { color: #7fa7ec; }
  .invuln { color: #4fd1c5; }
  /* Terminal game-over: a translucent dim over the whole scene plus a centred
     panel, so the final gameplay scene (trees, actors, ranger, scenery) stays
     visible behind it. */
  .kaka-gameover { position: fixed; inset: 0; z-index: 100; display: flex;
    align-items: center; justify-content: center; padding: 1rem;
    background: rgba(6,3,12,.34); }
  .kaka-go-panel { display: flex; flex-direction: column; align-items: center;
    text-align: center; padding: clamp(.8rem,2.2vw,1.4rem) clamp(1.2rem,4vw,2.6rem);
    border-radius: 1rem; background: rgba(12,4,14,.8);
    border: 2px solid rgba(255,60,60,.5); box-shadow: 0 0 50px rgba(0,0,0,.65);
    color: #ffd23f; max-width: 90vw; }
  .kaka-go-title { font-size: clamp(2.2rem, 8vw, 5rem); font-weight: 900; letter-spacing: .05em;
    color: #ff3d3d; text-shadow: 0 0 30px rgba(255,60,60,.85); line-height: 1; }
  .kaka-go-sub { font-size: clamp(1rem, 3.2vw, 2.1rem); font-weight: 800; color: #f2e9d8;
    margin: .35em 0 .7em; }
  .kaka-go-line { font-size: clamp(1rem, 2.6vw, 1.7rem); font-weight: 700; margin: .1em 0; }
  .kaka-go-again { font-size: clamp(.95rem, 2.2vw, 1.4rem); font-weight: 800; color: #7fd18a;
    margin: .9em 0 .4em; animation: pulse 1s steps(2) infinite; }
  .kaka-go-btn { font: inherit; font-size: 1.15rem; font-weight: 700; padding: .5em 1.4em;
    cursor: pointer; border-radius: .4rem; }
  .build { color: #6b7280; font-size: .8rem; margin: .5rem 0 0; }
</style>
</head>
<body>
<!-- Glon renders the HUD/status into data-glon-id="1"; JS only paints the canvas
     script Glon emits. The game is Glon-owned. -->
<p class="keys"><strong>Arrow keys / WASD</strong> move &middot; <strong>Space</strong> fire berry &middot;
   <strong>G</strong> Mystery Glon Berry &middot; <strong>R</strong> restart</p>
<div id="status" data-glon-id="1"></div>
<canvas id="glon-canvas" width="640" height="480" tabindex="0"></canvas>
<p class="muted">The kaka are native wildlife and must never be shot; berries divert them.
   Lasers only zap introduced rats. Arcade fiction: do not feed real wild kaka.
   &middot; <a href="../patrol/patrol.html">Glon Patrol</a></p>
<p class="build" id="kaka-build">Kākā D12A.7</p>
<script>window.__BUILD_SHA='440213c';</script>
<script src="kaka-host.js?v=d12b4"></script>
</body>
</html>
