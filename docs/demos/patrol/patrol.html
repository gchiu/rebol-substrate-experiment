<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glon Patrol</title>
<style>
  body { font: 15px/1.4 system-ui, sans-serif; margin: 1rem auto; max-width: 660px; background: #0b1020; color: #e8e8e8; }
  h1 { margin: .2rem 0; }
  .hud { font-size: 1.1rem; }
  #glon-canvas { display: block; width: 640px; height: 480px; border: 1px solid #334; background: #0b1020; }
  #glon-canvas:focus { outline: 2px solid #556; outline-offset: 2px; }
  button { font: inherit; padding: .4rem .8rem; cursor: pointer; }
  button.active { outline: 2px solid #ffe066; font-weight: 700; }
  .keys { color: #ffe066; font-size: 1.15rem; font-weight: 600; margin: .2rem 0 .7rem; }
  .keys strong { color: #fff; }
</style>
</head>
<body>
<!-- Glon renders the HUD/status here (data-glon-id="1"); JS only draws the
     canvas script Glon emits.  The game is Glon-owned. -->
<p class="keys"><strong>Arrow keys / WASD</strong> &mdash; fly &nbsp;&middot;&nbsp; <strong>Space</strong> &mdash; fire &nbsp;&middot;&nbsp; <strong>Restart</strong> after game over</p>
<div id="status" data-glon-id="1"></div>
<canvas id="glon-canvas" width="640" height="480" tabindex="0"></canvas>
<script src="patrol-host.js"></script>
</body>
</html>
