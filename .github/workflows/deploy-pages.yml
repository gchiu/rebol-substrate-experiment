# Build the G1E shop WASM with Emscripten and publish it under the existing
# GitHub Pages site (branch-mode: docs/ served from `main`).
#
# The existing R0/S1 counter demo (docs/index.html + demo.js/demo.wasm) and the
# W2 standalone demo (docs/standalone.html + glon.js/glon.wasm) are left
# untouched. The shop is added under docs/shop/:
#
#   demo/shop/app.html  ->  docs/shop/index.html
#   demo/shop/host.js   ->  docs/shop/host.js
#   demo/shop/glon.wasm ->  docs/shop/glon.wasm   (built here by Emscripten)
#
# The WASM is built fresh on every run (no committed stale binary); the built
# binary is committed back to main's docs/shop/ so the existing branch-mode
# Pages deployment picks it up.
name: Build and publish shop to Pages

on:
  push:
    branches: [glon-shop-g1a]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch and verify frozen-S1 tag
        run: |
          git fetch origin '+refs/tags/s1-frozen-v1:refs/tags/s1-frozen-v1'
          test "$(git rev-parse 's1-frozen-v1^{commit}')" = "f90496c26dc45c7a387d8fc8639cd2781507d3d2"

      - name: Frozen-S1 check
        run: ./check-frozen-s1.sh

      - name: Native tests
        run: make test

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Build shop WASM (diag -O1) and run G1E flow test
        run: |
          python3 demo/shop/build.py
          make wasm-g1a-test WASM_OPT=-O1 DIAG_FLAG=-DGLON_DIAGNOSTICS

      - name: Build shop WASM (diag -O0) and run G1E flow test
        run: |
          rm -f demo/shop/glon.wasm
          make wasm-g1a-test WASM_OPT=-O0 DIAG_FLAG=-DGLON_DIAGNOSTICS

      - name: Rebuild normal shop WASM (publish build, no diagnostics)
        run: |
          rm -f demo/shop/glon.wasm
          make demo/shop/glon.wasm

      - name: Assemble site files
        run: |
          rm -rf /tmp/shop && mkdir -p /tmp/shop
          cp demo/shop/app.html /tmp/shop/index.html
          cp demo/shop/style.css demo/shop/host.js demo/shop/glon.wasm /tmp/shop/
          cp -r demo/shop/demos /tmp/shop/demos

      - name: Checkout main (Pages source)
        uses: actions/checkout@v4
        with:
          ref: main
          path: pages

      - name: Publish docs/shop/ to main
        run: |
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p docs/shop
          cp -r /tmp/shop/. docs/shop/
          git add docs/shop
          if git diff --cached --quiet; then
            echo "docs/shop unchanged; nothing to commit"
          else
            git commit -m "Publish G1E demo launcher (built WASM) to docs/shop"
            git push origin HEAD:main
          fi
