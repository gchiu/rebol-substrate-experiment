# Build the G1E shop WASM with Emscripten and publish the Glon site on the
# existing GitHub Pages site (branch-mode: docs/ served from `main`):
#
#   site/index.html     ->  docs/index.html       (the Glon landing page)
#   docs/r0-counter.html + demo.js/demo.wasm      (the early R0/S1 counter demo,
#                                                  formerly the site root)
#   demo/shop/app.html  ->  docs/shop/index.html
#   demo/shop/host.js   ->  docs/shop/host.js
#   demo/shop/glon.wasm ->  docs/shop/glon.wasm   (built here by Emscripten)
#   ... and the standalone traffic, Linda and Saturnine primer pages.
#
# The W2 standalone demo (docs/standalone.html + glon.js/glon.wasm) is left
# untouched. site/check-site.py verifies the assembled tree before publishing.
#
# The WASM is built fresh on every run (no committed stale binary); the built
# binary is committed back to main's docs/shop/ so the existing branch-mode
# Pages deployment picks it up.
name: Build and publish shop to Pages

on:
  push:
    branches: [glon-shop-g1a]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch and verify frozen-S1 tag
        run: |
          git fetch origin '+refs/tags/s1-frozen-v1:refs/tags/s1-frozen-v1'
          test "$(git rev-parse 's1-frozen-v1^{commit}')" = "f90496c26dc45c7a387d8fc8639cd2781507d3d2"

      - name: Frozen-S1 check
        run: ./check-frozen-s1.sh

      - name: Native tests
        run: make test

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          # Pin Emscripten: 6.0.10 (the "latest" at this time) makes the
          # standalone -nostdlib link fail with "symbol exported via --export
          # not found: setThrew" (SUPPORT_LONGJMP defaults to 'emscripten',
          # which forces the setThrew export that the minimal no-runtime build
          # does not define). 6.0.9 is the last known-good release.
          version: 6.0.9

      - name: Build shop WASM and run G1E flow test
        run: |
          python3 demo/shop/build.py
          make wasm-g1a-test

      - name: WASM closure-origin binding + CASE regression
        run: make wasm-binding-test

      - name: Build standalone traffic page and run its test
        run: |
          python3 demo/shop/build-traffic.py
          make wasm-traffic-test

      - name: Build standalone Linda page and run its test
        run: |
          python3 demo/shop/build-linda.py
          make wasm-linda-test

      - name: Build the live Glon primer and run every example through WASM
        run: |
          python3 demo/shop/build-primer.py --check
          make wasm-primer-test

      - name: Assemble site files
        run: |
          rm -rf /tmp/shop && mkdir -p /tmp/shop
          cp demo/shop/app.html /tmp/shop/index.html
          cp demo/shop/style.css demo/shop/host.js demo/shop/glon.wasm /tmp/shop/
          cp demo/shop/traffic.html demo/shop/traffic-host.js /tmp/shop/
          cp demo/shop/linda.html demo/shop/linda-host.js /tmp/shop/
          cp demo/shop/primer.html demo/shop/primer-host.js /tmp/shop/
          cp -r demo/shop/demos /tmp/shop/demos

      - name: Checkout main (Pages source)
        uses: actions/checkout@v4
        with:
          ref: main
          path: pages

      - name: Publish the site to main
        run: |
          mkdir -p pages/docs/shop
          cp -r /tmp/shop/. pages/docs/shop/
          cp site/index.html pages/docs/index.html
          cp docs/r0-counter.html docs/demo.js docs/demo.wasm pages/docs/
          python3 site/check-site.py pages/docs
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/shop docs/index.html docs/r0-counter.html docs/demo.js docs/demo.wasm
          if git diff --cached --quiet; then
            echo "docs/ unchanged; nothing to commit"
          else
            git commit -m "Publish the Glon site (landing page and built demos) to docs/"
            git push origin HEAD:main
          fi
