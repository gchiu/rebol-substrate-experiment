# TEMPORARY (GLON-C3-2F): Windows x86-64 diagnosis of the task-runtime
# startup failure in run 46153543854 (exit 127, no output).  Windows only; the
# five-platform native matrix ignores ci/glon-c3-1 while this file exists.
# Remove this file and that filter once the Windows problem is fixed.
name: C3-2F Windows task-runtime diagnosis (temporary)

on:
  push:
    branches:
      - ci/glon-c3-1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-diag:
    name: windows-x86_64 task-runtime diagnosis
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CI_PLATFORM: windows
      CI_ARCH: x86_64
      CFLAGS: '-std=c17 -fwrapv -Wall -Wextra -O0 -g -Ddup=_dup -Ddup2=_dup2 -Dclose=_close -Dopen=_open'
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up MSYS2 MinGW-w64 (as the native matrix)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            diffutils
            unzip
            zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-zlib

      - name: Prepare MSYS2 Python alias (as the native matrix)
        shell: 'msys2 {0}'
        run: |
          mkdir -p /usr/local/bin
          printf '#!/bin/sh\nexec /ucrt64/bin/python.exe "$@"\n' > /usr/local/bin/python3
          chmod +x /usr/local/bin/python3

      # The original failing test, unchanged and blocking: the job stays red
      # while it fails, so the diagnostics below cannot conceal it.
      - name: Reproduce task-runtime-test (original native-suite step)
        shell: 'msys2 {0}'
        run: |
          mkdir -p ci-logs/c3-2f
          set -o pipefail
          make task-runtime-test 2>&1 | tee ci-logs/c3-2f/task-runtime.log

      - name: Diagnose (non-blocking)
        if: always()
        continue-on-error: true
        shell: 'msys2 {0}'
        run: bash scripts/ci/c3-2f-windows-diag.sh ci-logs/c3-2f

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: c3-2f-windows-diag
          path: ci-logs/c3-2f/
          if-no-files-found: warn
          retention-days: 14
