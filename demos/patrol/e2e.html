<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Glon Patrol E2E</title></head>
<body>
<!-- Test-only harness: same page + patrol-host.js as patrol.html, plus
     automation that flies, fires, checks the canvas rendered, and restarts. -->
<div id="status" data-glon-id="1"></div>
<canvas id="glon-canvas" width="640" height="480"></canvas>
<pre id="verify">pending</pre>
<script src="patrol-host.js"></script>
<script>
(function () {
  var v = document.getElementById("verify");
  var step = 0, startX = null, moved = false, fired = false, restartOk = false, canvasDrawn = false;
  function state() { var e = document.getElementById("patrol-state"); return e ? e.textContent.trim() : ""; }
  function press(code, down) {
    window.dispatchEvent(new KeyboardEvent(down ? "keydown" : "keyup", { code: code, bubbles: true, cancelable: true }));
  }
  function canvasOk() {
    var c = document.getElementById("glon-canvas");
    var d = c.getContext("2d").getImageData(0, 0, c.width, c.height).data;
    for (var i = 0; i < d.length; i += 4) if (d[i] > 40 || d[i + 1] > 40 || d[i + 2] > 40) return true;
    return false;
  }
  setInterval(function () {
    var s = state();
    var a = s ? s.split(" ") : [];
    if (step === 0 && a.length >= 6) { startX = +a[0]; press("ArrowRight", true); step = 1; }
    else if (step === 1) { if (+a[0] > startX) { moved = true; press("ArrowRight", false); press("Space", true); step = 2; } }
    else if (step === 2) { if (+a[5] === 1) { fired = true; press("Space", false); step = 3; } }
    else if (step === 3) {
      canvasDrawn = canvasOk();
      var btn = document.querySelector("[data-glon-event='patrol-restart']");
      if (btn) { btn.click(); step = 4; }
    } else if (step === 4) {
      if (+a[0] === 300 && +a[2] === 0 && +a[3] === 5) { restartOk = true; step = 5; }
    }
    if (step >= 1) {
      v.textContent = (step === 5 ? "PATROL_BROWSER_OK" : "RUNNING") +
        " moved=" + moved + " fired=" + fired + " canvas=" + canvasDrawn + " restart=" + restartOk + " state=" + s;
    }
  }, 100);
})();
</script>
</body>
</html>
