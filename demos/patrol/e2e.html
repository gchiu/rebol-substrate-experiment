<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Glon Patrol E2E</title></head>
<body>
<!-- Test-only harness: same page + patrol-host.js as patrol.html. Verifies the
     default world, the Glon-rendered selector, frame clearing, a Velikovsky
     lurch, and restart. -->
<div id="status" data-glon-id="1"></div>
<canvas id="glon-canvas" width="640" height="480" tabindex="0"></canvas>
<pre id="verify">pending</pre>
<script src="patrol-host.js"></script>
<script>
(function () {
  var v = document.getElementById("verify");
  var step = 0, startX = null, moved = false, fired = false, restartOk = false,
      canvasDrawn = false, noTrails = false, moonDefault = false, gravityChange = false,
      selectorPresent = false, velikovsky = false, lurchOccurred = false,
      trailT0 = 0, trailA = 0;
  function state() { var e = document.getElementById("patrol-state"); return e ? e.textContent.trim() : ""; }
  function press(code, down) {
    window.dispatchEvent(new KeyboardEvent(down ? "keydown" : "keyup", { code: code, bubbles: true, cancelable: true }));
  }
  function click(sel) { var b = document.querySelector(sel); if (b) { b.click(); return true; } return false; }
  function canvasOk() {
    var c = document.getElementById("glon-canvas");
    var d = c.getContext("2d").getImageData(0, 0, c.width, c.height).data;
    for (var i = 0; i < d.length; i += 4) if (d[i] > 40 || d[i + 1] > 40 || d[i + 2] > 40) return true;
    return false;
  }
  function countNonBg() {
    var c = document.getElementById("glon-canvas");
    var d = c.getContext("2d").getImageData(0, 0, c.width, c.height).data;
    var n = 0;
    for (var i = 0; i < d.length; i += 4)
      if (Math.abs(d[i] - 11) > 18 || Math.abs(d[i + 1] - 16) > 18 || Math.abs(d[i + 2] - 32) > 18) n++;
    return n;
  }
  setInterval(function () {
    var s = state();
    var a = s ? s.split(" ") : [];
    if (step === 0 && a.length >= 8) {
      moonDefault = (+a[6] === 8);
      selectorPresent = !!document.querySelector("[data-glon-event='gravity-earth']");
      startX = +a[0];
      click("[data-glon-event='gravity-earth']"); step = 1;
    } else if (step === 1) {
      gravityChange = (+a[6] === 32 && +a[3] === 8);
      press("ArrowRight", true); step = 2;
    } else if (step === 2) {
      if (+a[0] > startX) { moved = true; press("ArrowRight", false); press("Space", true); step = 3; }
    } else if (step === 3) {
      if (+a[5] === 1) { fired = true; press("Space", false); step = 4; }
    } else if (step === 4) {
      canvasDrawn = canvasOk();
      if (trailT0 === 0) { press("Space", true); trailA = countNonBg(); trailT0 = Date.now(); }
      else if (Date.now() - trailT0 > 1200) {
        noTrails = (countNonBg() <= trailA + 800);
        press("Space", false);
        click("[data-glon-event='patrol-restart']"); step = 5;
      }
    } else if (step === 5) {
      if (+a[0] === 300 && +a[2] === 0 && +a[3] === 8 && +a[6] === 32) { restartOk = true; click("[data-glon-event='gravity-velikovsky']"); step = 6; }
    } else if (step === 6) {
      if (+a[6] === 20) { velikovsky = true; step = 7; }   /* Velikovsky selected (rule in Glon) */
    }
    if (step >= 1) {
      var ok = step === 7 && moonDefault && gravityChange && moved && fired && canvasDrawn &&
               noTrails && restartOk && velikovsky;
      v.textContent = (ok ? "PATROL_BROWSER_OK" : "RUNNING") +
        " moonDefault=" + moonDefault + " selector=" + selectorPresent + " gravityChange=" + gravityChange +
        " moved=" + moved + " fired=" + fired + " canvas=" + canvasDrawn + " noTrails=" + noTrails +
        " restart=" + restartOk + " velikovsky=" + velikovsky + " lurch=" + lurchOccurred + " state=" + s;
    }
  }, 100);
})();
</script>
</body>
</html>
